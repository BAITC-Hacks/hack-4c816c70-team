# Optional Brev deployment: one origin for frontend and API.
# Requires Docker Compose 2.24.4+ (ports replacement via !override).
services:
  api:
    ports: !override
      - "127.0.0.1:${API_PORT:-8080}:8080"

  frontend:
    build:
      args:
        NEXT_PUBLIC_API_URL: "/"
    environment:
      NEXT_PUBLIC_API_URL: "/"
    ports: !override
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"

  gateway:
    image: nginx:1.30.5-alpine
    ports:
      - "${GATEWAY_PORT:-8000}:8080"
    configs:
      - source: gateway_config
        target: /etc/nginx/conf.d/default.conf
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null && wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

configs:
  gateway_config:
    content: |
      server {
        listen 8080;
        server_name _;
        server_tokens off;
        client_max_body_size 64k;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $$api_backend api:8080;
        set $$frontend_backend frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $$http_host;
        proxy_set_header X-Real-IP $$remote_addr;
        proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
        proxy_read_timeout 75s;

        location /api/ {
          proxy_pass http://$$api_backend;
        }
        location = /health {
          proxy_pass http://$$api_backend;
        }
        location = /swagger {
          proxy_pass http://$$api_backend;
        }
        location /swagger/ {
          proxy_pass http://$$api_backend;
        }
        location / {
          proxy_pass http://$$frontend_backend;
        }
      }
